version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --include=dev
        - npx prisma generate
    build:
      commands:
        - env | grep -e AUTH0_BASE_URL >> .env.production || true
        - env | grep -e AUTH0_CLIENT_ID >> .env.production || true
        - env | grep -e AUTH0_CLIENT_SECRET >> .env.production || true
        - env | grep -e AUTH0_ISSUER_BASE_URL >> .env.production || true
        - env | grep -e AUTH0_SECRET >> .env.production || true
        - env | grep -e DATABASE_URL >> .env.production || true
        - env | grep -e DELETE_HOLIDAY_CASCADE_ENABLED >> .env.production || true
        - env | grep -e NEXT_PUBLIC_AUTH0_CALLBACK_URL >> .env.production || true
        - env | grep -e NEXT_PUBLIC_AUTH0_CLIENT_ID >> .env.production || true
        - env | grep -e NEXT_PUBLIC_AUTH0_DOMAIN >> .env.production || true
        - env | grep -e NEXT_PUBLIC_DISABLE_SERIALIZABLE_CHECK >> .env.production || true
        - env | grep -e NODE_ENV >> .env.production || true
        - env | grep -e PAYMENT_TEST_MODE >> .env.production || true
        - env | grep -e NEXT_PUBLIC_PAYMENTS_PROVIDER >> .env.production || true
        - env | grep -e STRIPE_SECRET_KEY >> .env.production || true
        - env | grep -e STRIPE_PRICE_ID >> .env.production || true
        - env | grep -e STRIPE_WEBHOOK_SECRET >> .env.production || true
        - env | grep -e SSE_API_SECRET >> .env.production || true
        - env | grep -e SSE_SERVICE_URL >> .env.production || true
        - env | grep -e NEXT_PUBLIC_SSE_SERVICE_URL >> .env.production || true
        - env | grep -e CLOUDWATCH_REGION >> .env.production || true
        - env | grep -e CLOUDWATCH_ACCESS_KEY_ID >> .env.production || true
        - env | grep -e CLOUDWATCH_SECRET_ACCESS_KEY >> .env.production || true
        - env | grep -e PERFORMANCE_CLOUDWATCH_ENABLED >> .env.production || true
        - env | grep -e NEXT_PUBLIC_SENTRY_DSN >> .env.production || true
        - env | grep -e NEXT_PUBLIC_UMAMI_WEBSITE_ID >> .env.production || true
        - env | grep -e NEXT_PUBLIC_UMAMI_SCRIPT_URL >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
customHeaders:
  - pattern: '**'
    headers:
      - key: 'Timing-Allow-Origin'
        value: '*'
