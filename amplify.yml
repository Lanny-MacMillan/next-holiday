version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --include=dev
        - npx prisma generate
    build:
      commands:
        - env | grep -e AUTH0_BASE_URL >> .env.production
        - env | grep -e AUTH0_CLIENT_ID >> .env.production
        - env | grep -e AUTH0_CLIENT_SECRET >> .env.production
        - env | grep -e AUTH0_ISSUER_BASE_URL >> .env.production
        - env | grep -e AUTH0_SECRET >> .env.production
        - env | grep -e DATABASE_URL >> .env.production
        - env | grep -e DELETE_HOLIDAY_CASCADE_ENABLED >> .env.production
        - env | grep -e NEXT_PUBLIC_AUTH0_CALLBACK_URL >> .env.production
        - env | grep -e NEXT_PUBLIC_AUTH0_CLIENT_ID >> .env.production
        - env | grep -e NEXT_PUBLIC_AUTH0_DOMAIN >> .env.production
        - env | grep -e NEXT_PUBLIC_DISABLE_SERIALIZABLE_CHECK >> .env.production
        - env | grep -e NODE_ENV >> .env.production
        - env | grep -e SSE_API_SECRET >> .env.production
        - env | grep -e SSE_SERVICE_URL >> .env.production
        - env | grep -e NEXT_PUBLIC_SSE_SERVICE_URL >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
