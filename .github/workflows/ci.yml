name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_FETCH_RETRIES: 5
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 5000
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 60000
  DATABASE_URL: mysql://ci:ci@localhost:3306/ci
  NEXT_PUBLIC_AUTH0_DOMAIN: ci.example.auth0.com
  NEXT_PUBLIC_AUTH0_CLIENT_ID: ci-client-id
  NEXT_PUBLIC_AUTH0_CALLBACK_URL: http://localhost:3000/
  AUTH0_SECRET: ci-secret
  AUTH0_BASE_URL: http://localhost:3000
  AUTH0_ISSUER_BASE_URL: https://ci.example.auth0.com
  AUTH0_CLIENT_ID: ci-client-id
  AUTH0_CLIENT_SECRET: ci-client-secret

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint -- --quiet
      - run: npm run format:check
      - name: Dead code
        run: npm run knip

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Tests with coverage
        run: npm run test:ci
      - name: Coverage of changed lines
        if: github.event_name == 'pull_request'
        run: |
          pip install diff-cover==10.0.0
          diff-cover coverage/cobertura-coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=70

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  # Runs against a real Auth0 test tenant; skipped until the E2E_* variables exist.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: vars.E2E_AUTH0_CLIENT_ID != ''
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uci -pci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      RATE_LIMIT_PER_MINUTE: '100000'
      NEXT_PUBLIC_AUTH0_DOMAIN: ${{ vars.E2E_AUTH0_DOMAIN }}
      AUTH0_ISSUER_BASE_URL: https://${{ vars.E2E_AUTH0_DOMAIN }}
      NEXT_PUBLIC_AUTH0_CLIENT_ID: ${{ vars.E2E_AUTH0_CLIENT_ID }}
      AUTH0_CLIENT_ID: ${{ vars.E2E_AUTH0_CLIENT_ID }}
      E2E_USER_A_EMAIL: ${{ secrets.E2E_USER_A_EMAIL }}
      E2E_USER_A_PASSWORD: ${{ secrets.E2E_USER_A_PASSWORD }}
      E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
      E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
