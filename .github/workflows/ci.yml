name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: mysql://ci:ci@localhost:3306/ci
      NEXT_PUBLIC_AUTH0_DOMAIN: ci.example.auth0.com
      NEXT_PUBLIC_AUTH0_CLIENT_ID: ci-client-id
      NEXT_PUBLIC_AUTH0_CALLBACK_URL: http://localhost:3000/
      AUTH0_SECRET: ci-secret
      AUTH0_BASE_URL: http://localhost:3000
      AUTH0_ISSUER_BASE_URL: https://ci.example.auth0.com
      AUTH0_CLIENT_ID: ci-client-id
      AUTH0_CLIENT_SECRET: ci-client-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: Lint
        run: npm run lint -- --quiet
      - name: Format
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test -- --ci
      - name: Build
        run: npm run build
